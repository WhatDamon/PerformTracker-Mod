name: Bug report
description: Report something that is not working correctly
title: '[Bug]: '
labels: type:bug, status:unread
body:
  - type: markdown
    attributes:
      value: >-
        Thank you for taking the time to file this issue to report a bug. Before doing so, please make sure you have completed the following preparatory steps:


        - I’ve already gone to [GitHub Actions](https://github.com/WhatDamon/PerformTracker-Mod/actions/workflows/build.yml) to download and use the latest automated build version, but the bug is still there.
        
        - I have investigated the issue and determined that it is not caused by any other factors.
        
        - I have searched and confirmed that there are no duplicate issues.
        
        - I understand that this issue will be closed if the information is incomplete.


        If you have already completed the necessary preparations, please fill out the form.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug.
      placeholder: Describe the bug here...
    validations:
      required: true
  - type: textarea
    id: step
    attributes:
      label: Steps to Reproduce
      description: >-
        How to reproduce the bug?<br />
        If you can provide logs, this field is optional.
      placeholder: >-
        1. Go to '...'
        2. Click on '...'
        3. See error
  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: >-
        Game logs, crash reports, etc.<br />
        You can usually find the log files within the folder `.minecraft/logs`. Most often, you will want the `latest.log` file, since that file belongs to the last played session of the game.<br />
        You can also find crash reports (with their date and time) in the folder `.minecraft/crash-reports`.
      placeholder: Drag the log to here directly.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Did you load this mod via the Sinytra Connector?
          required: false
        - label: >-
            I confirm that the above information is accurate and agree to answer any questions others may have regarding this issue.
          required: true
